[project]
name = "quadrotor-gnc-portfolio"
version = "0.1.0"
description = "Requirements-based automated V&V harness for quadrotor attitude control with physics-informed state estimation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dynamics*", "estimation*", "control*", "requirements*", "scenarios*", "reports*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
